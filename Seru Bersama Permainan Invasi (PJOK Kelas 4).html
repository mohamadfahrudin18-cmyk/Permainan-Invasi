<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seru Bersama Permainan Invasi</title>
<style>
:root{--bg:#eaf4ff;--card:#fff;--ink:#12335c;--mut:#4a6a92;--b1:#1e88e5;--b2:#90caf9;--b3:#e3f2fd;--ok:#1b8a4b;--okbg:#e4f7ec;--no:#c2410c;--nobg:#fff1e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1b2e;--card:#15283f;--ink:#e8f1ff;--mut:#9fb9d9;--b1:#4da3f0;--b2:#2a5a8f;--b3:#1b3555;--ok:#6fdc9c;--okbg:#12362445;--no:#ffb27a;--nobg:#3a2616}}
:root[data-theme="dark"]{--bg:#0d1b2e;--card:#15283f;--ink:#e8f1ff;--mut:#9fb9d9;--b1:#4da3f0;--b2:#2a5a8f;--b3:#1b3555;--ok:#6fdc9c;--okbg:#12362445;--no:#ffb27a;--nobg:#3a2616}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Trebuchet MS","Segoe UI",sans-serif;font-size:18px;line-height:1.5;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--b1);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;font-weight:800}
.bar .prog{flex:1;height:10px;background:#ffffff55;border-radius:9px;overflow:hidden}
.bar .prog i{display:block;height:100%;width:0;background:#fff;border-radius:9px;transition:width .5s}
main{max-width:760px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 6px 0 var(--b2);margin-bottom:16px;animation:pop .5s}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
h1,h2,h3{margin:.2em 0;color:var(--b1)}h1{font-size:2em;line-height:1.15}
.hero{text-align:center;background:linear-gradient(160deg,var(--card),var(--b3))}
.ball{font-size:84px;display:inline-block;animation:bounce 1s infinite ease-in;cursor:pointer;user-select:none}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-26px) rotate(180deg)}}
.kids{font-size:44px;letter-spacing:8px}
.btn{background:var(--b1);color:#fff;border:0;border-radius:999px;padding:12px 24px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 5px 0 #0d5aa7;margin:6px 4px;transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0d5aa7}.btn.alt{background:var(--card);color:var(--b1);box-shadow:0 5px 0 var(--b2);border:2px solid var(--b1)}
.btn:disabled{opacity:.5}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{flex:1;min-width:120px;padding:10px;border-radius:16px;border:2px solid var(--b2);background:var(--b3);color:var(--ink);font:inherit;font-weight:800;cursor:pointer}
.tab.on{background:var(--b1);color:#fff;border-color:var(--b1)}
.big{font-size:60px;text-align:center;animation:wob 2s infinite}
@keyframes wob{50%{transform:rotate(-8deg) scale(1.1)}}
ol,ul{padding-left:22px}li{margin:6px 0}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 16px;border-radius:16px;border:2px solid var(--b2);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt:hover:not(:disabled){background:var(--b3)}
.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--nobg);border-color:var(--no);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{border-radius:16px;padding:12px 16px;margin-top:10px;font-weight:700;animation:pop .4s}
.fb.good{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--nobg);color:var(--no)}
.chk{display:flex;gap:10px;align-items:center;padding:12px;border-radius:16px;background:var(--b3);margin:8px 0;cursor:pointer}
.chk input{width:24px;height:24px}
.stars{font-size:40px;text-align:center}.stars span{cursor:pointer;filter:grayscale(1);opacity:.5}.stars span.on{filter:none;opacity:1}
.emo{font-size:46px;background:none;border:3px solid transparent;border-radius:50%;cursor:pointer}.emo.on{border-color:var(--b1);background:var(--b3)}
.tag{display:inline-block;background:var(--b3);color:var(--b1);border-radius:999px;padding:2px 12px;font-size:.8em;font-weight:800}
.conf{position:fixed;top:-30px;font-size:28px;pointer-events:none;z-index:20;animation:fall 1.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.id{display:grid;gap:8px;margin-top:12px}.id input{padding:10px 14px;border-radius:14px;border:2px solid var(--b2);background:var(--card);color:var(--ink);font:inherit}
</style>
</head>
<body>
<div class="bar"><span>🏀 Seru Invasi</span><div class="prog"><i id="pg"></i></div><span id="pl">1/6</span></div>
<main id="app"></main>
<script>
var S=0,NAMES=["Pembuka","Tujuan","Materi","Aktivitas","Kuis","Refleksi"],user={n:"",k:""};
var MAT={
 "Melempar":{i:"🤾",t:"Mengoper bola ke teman dengan lengan.",s:["Berdiri, satu kaki di depan.","Pegang bola dengan dua tangan, mata melihat sasaran.","Ayunkan lengan ke depan lalu lepaskan bola.","Lengan lurus mengikuti arah bola."]},
 "Menangkap":{i:"🙌",t:"Menerima bola dari teman dengan dua tangan.",s:["Mata selalu melihat bola.","Bentuk tangan seperti mangkuk, jari terbuka.","Dekap bola ke dada.","Lutut sedikit ditekuk agar seimbang."]},
 "Menendang":{i:"⚽",t:"Mengoper bola dengan kaki ke arah teman.",s:["Letakkan kaki tumpu di samping bola.","Ayunkan kaki, kenai bola dengan sisi dalam kaki.","Pandang arah tujuan.","Ikuti ayunan kaki ke depan."]},
 "Menahan":{i:"🦶",t:"Menghentikan bola yang datang agar mudah dikuasai.",s:["Siapkan telapak kaki atau sisi kaki.","Sentuh bola dengan lembut.","Tarik kaki sedikit ke belakang saat bola menyentuh.","Bola berhenti dekat kakimu."]}};
var Q=[
["mc","Permainan invasi adalah permainan yang tim-nya berusaha…",["Membawa bola ke area lawan dan mencetak poin","Duduk diam menunggu bola","Berlari sendiri tanpa teman"],0,"Dalam permainan invasi, tim menyerang area lawan sambil menjaga area sendiri."],
["mc","Saat melempar bola ke teman, mata melihat ke…",["Langit","Sasaran atau temanmu","Sepatu"],1,"Melihat sasaran membuat lemparan lebih tepat."],
["mc","Tangan yang benar saat menangkap bola berbentuk seperti…",["Kepalan tinju","Mangkuk dengan jari terbuka","Tangan di belakang"],1,"Tangan seperti mangkuk dengan jari terbuka membuat bola mudah ditangkap."],
["mc","Bagian kaki yang tepat untuk mengoper bola dengan mudah adalah…",["Sisi dalam kaki","Ujung kuku","Tumit saja"],0,"Sisi dalam kaki luas sehingga arah bola lebih terkendali."],
["mc","Menahan bola dengan kaki dilakukan dengan sentuhan yang…",["Sangat keras","Lembut","Tanpa melihat bola"],1,"Sentuhan lembut membuat bola berhenti dekat kakimu."],
["mc","Contoh sikap gotong royong dalam permainan adalah…",["Menyimpan bola sendiri","Mengoper bola ke teman yang bebas","Mengejek teman"],1,"Mengoper bola ke teman membuat seluruh tim ikut bermain."],
["tf","Saat menangkap bola, mata boleh dipejamkan.",null,1,"Mata harus melihat bola agar tangan siap menangkap."],
["tf","Pemanasan perlu dilakukan sebelum bermain.",null,0,"Pemanasan menyiapkan otot dan mencegah cedera."],
["tf","Jika teman salah, kita boleh memarahinya.",null,1,"Lebih baik menyemangati teman. Semua bisa belajar."],
["tf","Minum air putih setelah olahraga membuat tubuh sehat.",null,0,"Tubuh kehilangan cairan saat berkeringat, jadi perlu minum air putih."]];
var QA=[],qi=0,score=0,answered=false;
var PRAISE=["Hebat sekali! 🌟","Kamu pintar! 👏","Mantap, pertahankan! 🏅","Keren banget! 🎉"],MOTI=["Tidak apa-apa, ayo coba lagi di soal berikutnya! 💪","Semangat! Salah itu bagian dari belajar. 🌈","Kamu pasti bisa! Terus berlatih. ⭐"];
function $(h){var d=document.createElement("div");d.innerHTML=h;return d}
function go(n){S=n;window.scrollTo({top:0,behavior:"smooth"});render()}
function render(){var a=document.getElementById("app");a.innerHTML="";document.getElementById("pg").style.width=((S+1)/6*100)+"%";document.getElementById("pl").textContent=(S+1)+"/6";[home,goals,materi,aktif,kuis,refleksi][S](a)}
function nav(p,n,lbl){return '<div class="row">'+(p!=null?'<button class="btn alt" onclick="go('+p+')">⬅️ Kembali</button>':'')+(n!=null?'<button class="btn" onclick="go('+n+')">'+(lbl||"Lanjut ➡️")+'</button>':'')+'</div>'}
function conf(){var e=["🏀","⭐","🎉","💙","⚽"];for(var i=0;i<18;i++){var s=document.createElement("span");s.className="conf";s.textContent=e[i%5];s.style.left=Math.random()*95+"vw";s.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(s);setTimeout(function(x){x.remove()},2300,s)}}

function home(a){a.appendChild($('<div class="card hero"><span class="tag">PJOK • Kelas 4 SD</span><h1>Seru Bersama<br>Permainan Invasi!</h1><div class="ball" onclick="conf()" title="Ketuk aku!">🏀</div><div class="kids">🧒👧🧒</div><p>Ayo belajar melempar, menangkap, menendang, dan menahan bola bersama teman. Ketuk bola untuk kejutan!</p><div class="id"><input id="nm" placeholder="Tulis namamu" value="'+user.n+'"><input id="kl" placeholder="Kelas (contoh: 4A)" value="'+user.k+'"></div><button class="btn" onclick="user.n=document.getElementById(\'nm\').value.trim();user.k=document.getElementById(\'kl\').value.trim();go(1)">Mulai Belajar 🚀</button></div>'))}

function goals(a){a.appendChild($('<div class="card"><h2>🎯 Tujuan Belajar</h2><p>Halo '+(user.n||"teman")+'! Setelah belajar, kamu bisa:</p><ul><li>🗣️ <b>Menjelaskan</b> cara melempar, menangkap, menendang, dan menahan bola.</li><li>🤸 <b>Mempraktikkan</b> gerakan itu dengan benar dan kreatif, juga menggabungkannya.</li><li>🤝 Bersikap <b>mandiri</b> dan <b>gotong royong</b> saat bermain.</li><li>🥤 Menerapkan <b>hidup sehat</b> setiap hari.</li></ul>'+nav(0,2)+'</div>'))}

var tabK="Melempar";
function materi(a){var h='<div class="card"><h2>📘 Materi Singkat</h2><p><b>Permainan invasi</b> adalah permainan beregu. Tim membawa bola ke area lawan untuk mencetak poin, sambil menjaga area sendiri. Contohnya sepak bola, bola basket, dan bola tangan. 🏀⚽🤾</p></div><div class="card"><h3>Pilih gerakan dasar:</h3><div class="tabs">';
for(var k in MAT)h+='<button class="tab'+(k==tabK?' on':'')+'" onclick="tabK=\''+k+'\';render()">'+MAT[k].i+' '+k+'</button>';
var m=MAT[tabK];h+='</div><div class="big">'+m.i+'</div><h3>'+tabK+' bola</h3><p>'+m.t+'</p><ol>'+m.s.map(function(x){return"<li>"+x+"</li>"}).join("")+'</ol><p>💡 <b>Kreatif:</b> gabungkan! Contoh: <i>tangkap → putar badan → lempar</i>.</p></div><div class="card"><h3>🥤 Hidup Sehat</h3><p>Pemanasan sebelum main, minum air putih, istirahat cukup, dan mencuci tangan sesudah bermain.</p>'+nav(1,3)+'</div>';a.appendChild($(h))}

var SIT=[["Bola datang menggelinding ke arahmu dan kamu ingin menghentikannya.","Menahan",["Menahan","Melempar"]],["Temanmu bebas di dekat gawang. Kamu pegang bola.","Melempar",["Menangkap","Melempar"]],["Bola dioper temanmu lewat udara ke arahmu.","Menangkap",["Menangkap","Menendang"]],["Bola ada di lantai dan temanmu jauh di depan.","Menendang",["Menendang","Menahan"]]],si=0,sdone=false,cl=[0,0,0,0],sc=0;
function aktif(a){var s=SIT[si],h='<div class="card"><h2>🎮 Aktivitas 1: Tebak Gerakan</h2><p>Gerakan apa yang paling tepat? ('+(si+1)+'/4)</p><p><b>'+s[0]+'</b></p><div id="sb">';
s[2].forEach(function(o){h+='<button class="opt" onclick="pick(this,\''+o+'\')">'+MAT[o].i+' '+o+'</button>'});
h+='</div><div id="sf"></div><div id="sn"></div></div>';
h+='<div class="card"><h2>🤝 Aktivitas 2: Misi Tim</h2><p>Berlatih dengan temanmu (atau sendiri di rumah) lalu centang!</p>';
["Aku melempar dan menangkap bola 5 kali bersama teman 🙌","Aku menendang dan menahan bola 5 kali ⚽","Aku membuat kombinasi gerakan sendiri 🌟","Aku menyemangati temanku dan mengoper bola dengan adil 💙"].forEach(function(t,i){h+='<label class="chk"><input type="checkbox" '+(cl[i]?'checked':'')+' onchange="cl['+i+']=this.checked?1:0;upd()"> '+t+'</label>'});
h+='<div class="fb good" id="cm">Selesai: '+cl.reduce(function(a,b){return a+b})+'/4</div>'+nav(2,4,"Ke Kuis 📝")+'</div>';a.appendChild($(h));sdone=false}
function upd(){var n=cl.reduce(function(a,b){return a+b});document.getElementById("cm").textContent="Selesai: "+n+"/4"+(n==4?" 🎉 Luar biasa, kamu mandiri dan suka gotong royong!":"");if(n==4)conf()}
function pick(b,o){if(sdone)return;sdone=true;var s=SIT[si],f=document.getElementById("sf");[].forEach.call(document.querySelectorAll("#sb .opt"),function(x){x.disabled=true});
if(o==s[1]){sc++;b.classList.add("good");f.innerHTML='<div class="fb good">'+PRAISE[si%4]+'</div>'}else{b.classList.add("bad");f.innerHTML='<div class="fb bad">Yang tepat adalah <b>'+s[1]+'</b>. Semangat, coba situasi berikutnya! 💪</div>'}
document.getElementById("sn").innerHTML=si<3?'<button class="btn" onclick="si++;render()">Situasi berikutnya ➡️</button>':'<div class="fb good">Skor tebakan: '+sc+'/4 ⭐</div><button class="btn alt" onclick="si=0;sc=0;render()">Main lagi 🔁</button>'}

function kuis(a){if(qi>=Q.length){var st=score>=9?"🏆 Juara Invasi!":score>=7?"🥈 Pemain Hebat!":score>=5?"🥉 Terus Berlatih!":"🌱 Ayo Belajar Lagi!";a.appendChild($('<div class="card hero"><h2>Hasil Kuis</h2><div class="big">'+st.split(" ")[0]+'</div><h1>'+score+' / 10</h1><p><b>'+st.substr(3)+'</b> '+(user.n?"Selamat, "+user.n+"!":"")+'</p><p>'+(score>=7?"Kamu sudah paham materi ini. Pertahankan ya!":"Tidak apa-apa. Baca materi lagi, lalu coba kuis sekali lagi.")+'</p><button class="btn alt" onclick="qi=0;score=0;render()">Ulangi 🔁</button><button class="btn" onclick="go(5)">Refleksi ➡️</button></div>'));if(score>=7)conf();return}
var q=Q[qi],opts=q[2]||["✅ Benar","❌ Salah"],h='<div class="card"><span class="tag">'+(q[0]=="mc"?"Pilihan Ganda":"Benar atau Salah")+' • Soal '+(qi+1)+'/10</span><h3 style="color:var(--ink)">'+q[1]+'</h3><div id="qo">';
opts.forEach(function(o,i){h+='<button class="opt" onclick="ans(this,'+i+')">'+o+'</button>'});
h+='</div><div id="qf"></div><div id="qn"></div></div>';a.appendChild($(h));answered=false}
function ans(b,i){if(answered)return;answered=true;var q=Q[qi],ok=i==q[3],bs=document.querySelectorAll("#qo .opt");[].forEach.call(bs,function(x){x.disabled=true});bs[q[3]].classList.add("good");var f=document.getElementById("qf");
if(ok){score++;f.innerHTML='<div class="fb good">'+PRAISE[qi%4]+'<br><small>'+q[4]+'</small></div>';conf()}else{b.classList.add("bad");f.innerHTML='<div class="fb bad">Belum tepat. '+q[4]+'<br>'+MOTI[qi%3]+'</div>'}
document.getElementById("qn").innerHTML='<button class="btn" onclick="qi++;render()">'+(qi<9?"Soal berikutnya ➡️":"Lihat hasil 🏁")+'</button>'}

var rate=0,emo="";
function refleksi(a){var h='<div class="card"><h2>🪞 Umpan Balik dan Refleksi</h2><p>Skor kuismu: <b>'+score+'/10</b>. Bagaimana perasaanmu belajar hari ini?</p><div class="row">';
["😄","🙂","😐","😕"].forEach(function(e){h+='<button class="emo'+(emo==e?' on':'')+'" onclick="emo=\''+e+'\';render()">'+e+'</button>'});
h+='</div><p>Seberapa yakin kamu bisa melempar, menangkap, menendang, dan menahan bola?</p><div class="stars">';
for(var i=1;i<=5;i++)h+='<span class="'+(i<=rate?'on':'')+'" onclick="rate='+i+';render();if('+i+'==5)conf()">⭐</span>';
h+='</div><p><b>Renungkan:</b></p><ul><li>Gerakan apa yang paling mudah bagimu?</li><li>Gerakan apa yang masih perlu dilatih? Bagaimana kamu berlatih mandiri?</li><li>Bagaimana kamu membantu temanmu hari ini? 🤝</li><li>Kebiasaan sehat apa yang akan kamu lakukan hari ini? 🥤</li></ul>';
if(rate)h+='<div class="fb good">'+(rate>=4?"Hebat, kamu percaya diri! Tetap berbagi ilmu dengan temanmu. 🌟":"Tidak apa-apa. Latihan sedikit setiap hari pasti membuatmu semakin mahir. 💪")+'</div>';
h+='<div class="card hero" style="margin-top:14px"><div class="kids">🧒🏀👧</div><h3>Terima kasih, '+(user.n||"teman hebat")+'!</h3><p>Ingat: mandiri, gotong royong, dan hidup sehat. 💙</p></div>'+nav(4,null)+'<div class="row"><button class="btn" onclick="qi=0;score=0;rate=0;emo=\'\';go(0)">Kembali ke awal 🏠</button></div></div>';a.appendChild($(h))}
render();
</script>
</body>
</html>
